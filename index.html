&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header&gt;&lt;h1&gt;Projetos desenvolvidos&lt;/h1&gt;&lt;div class=&quot;date&quot;&gt;Ponto de situação — 21 de outubro de 2026&lt;/div&gt;&lt;/header&gt;
&lt;section class=&quot;intro&quot;&gt;&lt;p&gt;Desde setembro de 2025, no âmbito da consolidação das atividades do Núcleo do Bolseiro da NOVA FCT, tem vindo a ser desenvolvido um trabalho de reorganização e sistematização dos procedimentos das bolsas de investigação, partindo das práticas existentes e integrando contributos das várias áreas envolvidas.&lt;/p&gt;&lt;p&gt;Esta iniciativa procura consolidar a interpretação das normas aplicáveis, harmonizar procedimentos, facilitar o acesso à informação e reforçar a articulação entre a Divisão de Recursos Humanos, departamentos, unidades de investigação e bolseiros.&lt;/p&gt;&lt;p&gt;Deste trabalho resultaram instrumentos complementares de apoio à gestão das bolsas, apresentados de seguida com o respetivo ponto de situação.&lt;/p&gt;&lt;/section&gt;
&lt;h2&gt;Instrumentos e respetivo estado de desenvolvimento&lt;/h2&gt;&lt;section class=&quot;cards&quot;&gt;&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;span class=&quot;title&quot;&gt;Manual Normativo das Bolsas de Investigação&lt;small&gt;Concluído e validado&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;h3&gt;Objetivo&lt;/h3&gt;&lt;p&gt;Reunir, sistematizar e articular as disposições legais e regulamentares aplicáveis às bolsas de investigação. Apoiar uma interpretação coerente e a harmonização dos procedimentos administrativos.&lt;/p&gt;&lt;h3&gt;Ponto de situação&lt;/h3&gt;&lt;p&gt;Validado pela Coordenação da Divisão de Recursos Humanos da NOVA FCT em abril de 2026. Na reunião de 13 de outubro foi apresentado o ponto de situação. Aguarda autorização para disponibilização na Intranet da NOVA FCT.&lt;/p&gt;&lt;h3&gt;Ligação para consulta&lt;/h3&gt;&lt;p class=&quot;link&quot;&gt;&lt;a href=&quot;https://bertulucci.github.io/manual-bolsas-novafct/&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;&gt;Consultar versão de demonstração ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;span class=&quot;title&quot;&gt;Guia de Acolhimento do Bolseiro&lt;small&gt;Concluído · publicação pendente&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;h3&gt;Objetivo&lt;/h3&gt;&lt;p&gt;Facilitar o acolhimento e a integração dos bolseiros, incluindo os que chegam do estrangeiro, com informação prática sobre campus, serviços, transportes e acesso à Faculdade.&lt;/p&gt;&lt;h3&gt;Ponto de situação&lt;/h3&gt;&lt;p&gt;Versão em português concluída e apresentada em 13 de outubro de 2026. Posteriormente, foram introduzidos ajustes e informações práticas relevantes sobre o acesso à NOVA FCT, os serviços úteis e o Portal do Bolseiro, tendo sido também concluída a versão em inglês.&lt;/p&gt;&lt;h3&gt;Ligação para consulta&lt;/h3&gt;&lt;p class=&quot;link&quot;&gt;&lt;a href=&quot;https://bertulucci.github.io/guia-bolseiro/&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;&gt;Consultar versão de demonstração ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;span class=&quot;title&quot;&gt;Portal do Bolseiro&lt;small&gt;Desenvolvido · validações pendentes&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;h3&gt;Objetivo&lt;/h3&gt;&lt;p&gt;Centralizar informação acessível sobre o Núcleo do Bolseiro, legislação, regulamentos, documentação de suporte, contactos e esclarecimento de dúvidas.&lt;/p&gt;&lt;h3&gt;Ponto de situação&lt;/h3&gt;&lt;p&gt;Na reunião de 13 de outubro de 2026, a Coordenação da Divisão de Recursos Humanos reconheceu a utilidade deste instrumento. Até 21 de outubro, foi integrada a página do Núcleo do Bolseiro, reorganizados os conteúdos em português e inglês e efetuada uma revisão sistemática da informação disponibilizada. O alojamento institucional continua por definir.&lt;/p&gt;&lt;h3&gt;Ligação para consulta&lt;/h3&gt;&lt;p class=&quot;link&quot;&gt;&lt;a href=&quot;https://bertulucci.github.io/portal-bolseiro/&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;&gt;Consultar versão de demonstração ↗&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;num&quot;&gt;04&lt;/span&gt;&lt;span class=&quot;title&quot;&gt;Manual de Procedimentos das Bolsas de Investigação&lt;small&gt;Em revisão final&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;h3&gt;Objetivo&lt;/h3&gt;&lt;p&gt;Sistematizar as tarefas e os circuitos administrativos de gestão das bolsas, incluindo abertura, contratação, renovação e cessação.&lt;/p&gt;&lt;h3&gt;Ponto de situação&lt;/h3&gt;&lt;p&gt;Na reunião de 13 de outubro, foi aprovada a proposta de integrar o pedido de contratação no mesmo processo GESDOC da abertura do concurso. A adaptação dos circuitos e a revisão do Manual encontram-se em curso; esta alteração ainda não foi incorporada no documento. Após a revisão, seguirá para validação pela Coordenação da DRH.&lt;/p&gt;&lt;h3&gt;Ligação para consulta&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Ligação de consulta ainda não disponibilizada.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;num&quot;&gt;05&lt;/span&gt;&lt;span class=&quot;title&quot;&gt;Guia de Procedimentos das Bolsas de Investigação&lt;span style=&quot;display:block;font-size:14px;font-weight:500;margin-top:3px&quot;&gt;Departamentos e Unidades de Investigação&lt;/span&gt;&lt;small&gt;Em desenvolvimento&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;h3&gt;Objetivo&lt;/h3&gt;&lt;p&gt;Disponibilizar aos departamentos e unidades de investigação um instrumento de apoio com orientações normativas e práticas para a gestão das bolsas de investigação. Promover conhecimento transversal e harmonização dos procedimentos na NOVA FCT, apoiando o início e a tramitação dos processos com clareza de requisitos, etapas e responsabilidades.&lt;/p&gt;&lt;h3&gt;Ponto de situação&lt;/h3&gt;&lt;p&gt;Em 13 de outubro, foi aprovada a continuidade do desenvolvimento. Prevê-se concluir uma versão de trabalho na primeira quinzena de novembro, testar com um ou dois departamentos e submeter a revisão e validação final.&lt;/p&gt;&lt;h3&gt;Ligação para consulta&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Ligação de consulta ainda não disponibilizada.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;card&quot;&gt;&lt;summary&gt;&lt;span class=&quot;num&quot;&gt;06&lt;/span&gt;&lt;span class=&quot;title&quot;&gt;Assistente Virtual do Bolseiro&lt;span style=&quot;display:block;font-size:14px;font-weight:500;margin-top:3px&quot;&gt;Portal do Bolseiro&lt;/span&gt;&lt;small&gt;Integrado no Portal · FAQ&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;body&quot;&gt;&lt;h3&gt;Objetivo&lt;/h3&gt;&lt;p&gt;Responder às dúvidas dos bolseiros com base em conteúdo normativo validado, em português e inglês.&lt;/p&gt;&lt;h3&gt;Ponto de situação&lt;/h3&gt;&lt;p&gt;Foi desenvolvido e testado um protótipo com inteligência artificial, alimentado por uma matriz bilingue de perguntas e respostas construída para esse fim. Os testes mostraram desvios nas respostas geradas, pelo que a versão com IA não avançou. A matriz base de conteúdo foi auditada entrada a entrada e passou a alimentar diretamente a «FAQ» integrada no Portal do Bolseiro, com pesquisa sem IA.&lt;/p&gt;&lt;h3&gt;Ligação para consulta&lt;/h3&gt;&lt;p class=&quot;muted&quot;&gt;Ligação de consulta ainda não disponibilizada.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;&lt;script&gt;document.querySelectorAll(&quot;details.card&quot;).forEach(card=&gt;card.addEventListener(&quot;toggle&quot;,()=&gt;{if(card.open)document.querySelectorAll(&quot;details.card&quot;).forEach(other=&gt;{if(other!==card)other.open=false})}));&lt;/script&gt;&lt;p class=&quot;note&quot;&gt;As ligações externas permitem consultar versões de demonstração dos instrumentos e não representam publicação institucional. Os prazos indicados são previsões de trabalho, sujeitos a validação.&lt;/p&gt;&lt;/main&gt;&lt;script&gt;(function(){function send(){parent.postMessage({kind:&#x27;nova-fct-height&#x27;,frame:&#x27;projetos&#x27;,height:Math.ceil(document.body.getBoundingClientRect().height)},&#x27;*&#x27;)}if(document.readySt &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;div class=&quot;topline&quot; id=&quot;progress&quot;&gt;&lt;/div&gt;&lt;header&gt;&lt;div class=&quot;wrap&quot;&gt;&lt;h1&gt;Análise dos procedimentos administrativos&lt;/h1&gt;&lt;p&gt;Foram analisados 156 processos reais registados no GESDOC entre 2024 e 2026, comparando o circuito anterior com o atual. Os tempos foram medidos a partir das datas de cada despacho e tratados com análise estatística, para que a comparação se baseie em dados observados e não em impressões.&lt;/p&gt;&lt;span class=&quot;pill&quot;&gt;Análise comparativa · 2024–2026&lt;/span&gt;&lt;/div&gt;&lt;/header&gt;&lt;main&gt;
&lt;div class=&quot;kpis reveal&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;strong&gt;36% → 2%&lt;/strong&gt;&lt;small&gt;renovações com incidentes, antes e agora&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;strong data-count=&quot;9&quot; data-suffix=&quot; dias&quot;&gt;9 dias&lt;/strong&gt;&lt;small&gt;9 em cada 10 renovações concluídas neste prazo (antes, mais de 35 dias)&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;strong style=&quot;font-size:29px&quot;&gt;Cabimentação prévia&lt;/strong&gt;&lt;small&gt;feita antes da publicação do concurso: a contratação deixa de ficar bloqueada por falta de cabimento&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
&lt;section class=&quot;reveal&quot;&gt;&lt;h2&gt;Os processos administrativos analisados&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;A estrutura de cada processo difere entre o circuito anterior e o atual; cada cartão descreve as principais alterações.&lt;/p&gt;&lt;div class=&quot;processes&quot;&gt;
&lt;article class=&quot;process&quot;&gt;&lt;h3&gt;Renovação&lt;/h3&gt;&lt;span class=&quot;count&quot;&gt;84 processos&lt;/span&gt;&lt;p&gt;Comparação da mesma etapa nos dois circuitos: em metade dos casos, a decisão passou a ser tomada em até 4 dias (antes, 7 dias).&lt;/p&gt;&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Período de férias da NOVA FCT&lt;/span&gt;&lt;b&gt;Menor impacto observado&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;process&quot;&gt;&lt;h3&gt;Abertura de Concurso&lt;/h3&gt;&lt;span class=&quot;count&quot;&gt;24 processos&lt;/span&gt;&lt;p&gt;Circuito formalizado no GESDOC, permitindo identificar e medir as etapas do pedido até à publicação.&lt;/p&gt;&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Em metade dos pedidos, a autorização foi dada em até&lt;/span&gt;&lt;b&gt;5 dias&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Da autorização à publicação, em metade dos casos&lt;/span&gt;&lt;b&gt;1 dia&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;button aria-controls=&quot;d2&quot; aria-expanded=&quot;false&quot;&gt;Ver as três fases &lt;span&gt;＋&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;detail&quot; id=&quot;d2&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;Pedido e validação&lt;/b&gt; — conferência do pedido e dos valores da bolsa.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Cabimentação e autorização&lt;/b&gt; — análise e validação pelo Financeiro e autorização da Administração, antes de publicar.&lt;/li&gt;&lt;li&gt;&lt;b&gt;Publicação e registo&lt;/b&gt; — aviso publicado e associado ao processo.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article class=&quot;process&quot;&gt;&lt;h3&gt;Contratação&lt;/h3&gt;&lt;span class=&quot;count&quot;&gt;48 processos&lt;/span&gt;&lt;p&gt;A decisão final passou de 8 para 1 dia, mas a cabimentação passou a ser feita na abertura do concurso. Por isso, esta redução não equivale a uma redução do ciclo completo.&lt;/p&gt;&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;span&gt;Ciclo completo, da abertura do concurso à contratação&lt;/span&gt;&lt;b&gt;cerca de 36 dias&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;reveal&quot;&gt;&lt;h2&gt;Antes e agora&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;Comparação dos indicadores observados nos dois circuitos.&lt;/p&gt;&lt;div class=&quot;panel bars&quot;&gt;&lt;div&gt;&lt;span class=&quot;charttitle&quot;&gt;Renovação&lt;/span&gt;&lt;span class=&quot;chartsub&quot;&gt;Até à decisão, em metade dos casos&lt;/span&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Antes&lt;/span&gt;&lt;b&gt;7 dias&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; data-width=&quot;100&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Agora&lt;/span&gt;&lt;b&gt;4 dias&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill after&quot; data-width=&quot;57.14&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;charttitle&quot;&gt;Renovação&lt;/span&gt;&lt;span class=&quot;chartsub&quot;&gt;Processos com algum incidente&lt;/span&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Antes&lt;/span&gt;&lt;b&gt;36%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; data-width=&quot;100&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Agora&lt;/span&gt;&lt;b&gt;2%&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill after&quot; data-width=&quot;5.56&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;charttitle&quot;&gt;Contratação&lt;/span&gt;&lt;span class=&quot;chartsub&quot;&gt;Decisão final, em metade dos casos&lt;/span&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Antes&lt;/span&gt;&lt;b&gt;8 dias&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; data-width=&quot;100&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Agora&lt;/span&gt;&lt;b&gt;1 dia&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill after&quot; data-width=&quot;12.5&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;caveat&quot;&gt;&lt;b&gt;Ler com cautela:&lt;/b&gt; o «antes» e o «agora» não medem exatamente a mesma coisa — o passo da cabimentação mudou para a abertura do concurso.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;reveal&quot;&gt;&lt;h2&gt;Onde o tempo se concentra na abertura de concurso&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;Percentagem de processos em que cada etapa concentrou o maior tempo de tramitação, antes da autorização.&lt;/p&gt;&lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Aprovação do Departamento&lt;/span&gt;&lt;b&gt;54% (13 processos)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill after&quot; data-width=&quot;54.17&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Cabimentação&lt;/span&gt;&lt;b&gt;42% (10 processos)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill after&quot; data-width=&quot;41.67&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;barrow&quot;&gt;&lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Outros&lt;/span&gt;&lt;b&gt;4% (1 processo)&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill after&quot; data-width=&quot;4.17&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;chartnote&quot;&gt;Base: 24 processos de abertura de concurso, janeiro a setembro de 2026.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;reveal&quot;&gt;&lt;h2&gt;Resumo das melhorias&lt;/h2&gt;&lt;p class=&quot;intro&quot;&gt;A mesma lógica de controlo aplicada aos três processos: fazer a cabimentação mais cedo e tornar cada etapa visível e com responsável.&lt;/p&gt;&lt;div class=&quot;panel tablewrap&quot;&gt;&lt;table class=&quot;table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Processo&lt;/th&gt;&lt;th&gt;Antes&lt;/th&gt;&lt;th&gt;Agora&lt;/th&gt;&lt;th&gt;Efeito&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Abertura&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Cabimentação só no fim do concurso&lt;/td&gt;&lt;td&gt;Validação e cabimentação antes da publicação&lt;/td&gt;&lt;td&gt;Etapas mensuráveis&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Contratação&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Passagem pelo Financeiro nesta fase&lt;/td&gt;&lt;td&gt;Autorização com cabimentação já feita na abertura&lt;/td&gt;&lt;td&gt;Menos passagens no circuito&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Renovação&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Encaminhamento avulso, sem etapas nomeadas&lt;/td&gt;&lt;td&gt;Etapas nomeadas no GESDOC e aviso mensal antecipado&lt;/td&gt;&lt;td&gt;Menos incidentes documentados&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;summary&quot;&gt;&lt;strong&gt;Resultados observados: maior previsibilidade e melhor visibilidade das etapas.&lt;/strong&gt;&lt;p class=&quot;method-note&quot;&gt;&lt;strong&gt;Nota metodológica. &lt;/strong&gt;As diferenças observadas entre os períodos analisados não demonstram, por si só, uma relação causal direta com a reorganização dos procedimentos. O registo sistemático das etapas no GESDOC permite acompanhar os indicadores ao longo do tempo e avaliar progressivamente os efeitos das alterações implementadas. Esta análise demonstra que as etapas dos procedimentos podem ser medidas de forma objetiva a partir dos registos do GESDOC. Prevê-se repeti-la no final de 2027, com uma amostra do circuito atual mais alargada e, por isso, com resultados mais robustos.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;Fontes: análise comparativa de renovação (84 processos, mai/2024–set/2026), abertura de concurso (24 processos, jan–set/2026) e contratação (48 processos, fev/2024–set/2026).&lt;/footer&gt;
